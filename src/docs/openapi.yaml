    LearningQuizQuestionWrite:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          example: Which action is the first priority?
        questionType:
          type: string
          example: single_choice
        clinicalContext:
          type: string
          nullable: true
          example: Labor ward
        points:
          type: number
          example: 1
        explanation:
          type: string
          nullable: true
          example: Emergency assessment comes first.
        orderNumber:
          type: integer
          example: 0
        correctAnswer:
          type: string
          enum: [A, B, C, D]
          example: B
          description: Letter of the correct choice when using choices A-D.
        choices:
          type: object
          description: A, B, C, and D answer texts. Stored as existing quiz options (A=0, B=1, C=2, D=3).
          properties:
            A:
              type: string
              example: Delay evaluation
            B:
              type: string
              example: Start emergency assessment
            C:
              type: string
              example: Discharge immediately
            D:
              type: string
              example: Wait for lab results
          example:
            A: Delay evaluation
            B: Start emergency assessment
            C: Discharge immediately
            D: Wait for lab results
        options:
          type: array
          description: Alternative to choices. Use label A-D or isCorrect on each option.
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                example: Start emergency assessment
              isCorrect:
                type: boolean
                example: true
              label:
                type: string
                enum: [A, B, C, D]
                example: B
              orderNumber:
                type: integer
                example: 1
      example:
        prompt: Which action is the first priority?
        questionType: single_choice
        clinicalContext: Labor ward
        points: 1
        explanation: Emergency assessment comes first.
        orderNumber: 0
        choices:
          A: Delay evaluation
          B: Start emergency assessment
          C: Discharge immediately
          D: Wait for lab results
        correctAnswer: B
