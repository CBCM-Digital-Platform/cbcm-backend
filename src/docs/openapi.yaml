openapi: 3.0.0
info:
  title: CBCM Backend API
  version: 1.0.0
  description: CBCM authentication, user management, facilities, mentorship cycles, and cycle configuration APIs.
servers:
  - url: https://cbcm-backend-1.onrender.com
    description: Production server
  - url: http://localhost:5000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
              example: []
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@cbcm.org
        password:
          type: string
          format: password
          example: Admin@123
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - accessToken
            - refreshToken
            - user
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiJ9...
            accessTokenExpiresIn:
              type: string
              example: 15m
            refreshToken:
              type: string
              pattern: ^[a-f0-9]{64}$
              example: 64-character opaque refresh token
            refreshTokenExpiresAt:
              type: string
              format: date-time
              example: '2026-11-04T12:00:00.000Z'
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: If that email exists, a reset link will be sent.
        meta:
          type: object
          example: {}
    BooleanActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            reset:
              type: boolean
              example: true
            changed:
              type: boolean
              example: true
            revoked:
              type: boolean
              example: true
        meta:
          type: object
          example: {}
    RefreshTokenResponse:
      $ref: '#/components/schemas/LoginResponse'
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ForgotOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character one-time token delivered by email
        new_password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
        confirm_password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
        password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
          description: Backward-compatible alias for legacy clients.
    ResetOtpRequest:
      type: object
      required:
        - email
        - otp
        - new_password
        - confirm_password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        otp:
          type: string
          pattern: ^\d{6}$
          example: '123456'
        new_password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
        confirm_password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    UserProfile:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        role:
          type: string
          example: mentee
        status:
          type: string
          example: active
        facility_id:
          type: integer
          nullable: true
        highest_qualification:
          type: string
          nullable: true
        training_status:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        must_change_password:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    SessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          example: Jane Doe
        phone:
          type: string
          minLength: 7
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        avatar_url:
          type: string
          format: uri
          example: https://example.com/avatar.jpg
      additionalProperties: false
    UserPreferences:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 10
        language:
          type: string
          maxLength: 20
          nullable: true
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
          nullable: true
          example: system
        notifications_enabled:
          type: boolean
          nullable: true
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateUserPreferencesRequest:
      type: object
      minProperties: 1
      properties:
        language:
          type: string
          maxLength: 20
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        notifications_enabled:
          type: boolean
          example: true
      additionalProperties: false
    PreferencesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/UserPreferences'
          nullable: true
        meta:
          type: object
          example: {}
    CreateUserRequest:
      type: object
      required:
        - full_name
        - email
        - password
        - role
      properties:
        full_name:
          type: string
          minLength: 1
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: TemporaryPass1!
        role:
          type: string
          enum:
            - admin
            - facility_admin
            - mentor
            - mentee
          example: mentee
        facility_id:
          type: integer
          minimum: 1
          nullable: true
          example: 2
        phone:
          type: string
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        must_change_password:
          type: boolean
          default: true
          example: true
      additionalProperties: false
    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
          example: inactive
    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 3
    Facility:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Central Health Center
        type:
          type: string
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FacilityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    FacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 12
            totalPages:
              type: integer
              example: 1
    CreateFacilityRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          example: Central Health Center
        type:
          type: string
          minLength: 1
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    UpdateFacilityRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        level:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        woreda:
          type: string
          nullable: true
        kebele:
          type: string
          nullable: true
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    MentorshipCycle:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 2026 Mentorship Cycle 1
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          example: draft
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CycleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          example: {}
    CycleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 8
            totalPages:
              type: integer
              example: 1
    CreateCycleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: 2026 Mentorship Cycle 1
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
      additionalProperties: false
    UpdateCycleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
      additionalProperties: false
    UpdateCycleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          description: 'Transitions: draft to planned/cancelled; planned to active/cancelled; active to completed/cancelled. Completed and cancelled are terminal.'
      additionalProperties: false
    CycleFacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    CycleThematicAreaListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required:
              - id
              - code
              - name
            properties:
              id:
                type: integer
                example: 1
              code:
                type: string
                example: ANC
              name:
                type: string
                example: Antenatal care
        meta:
          type: object
          example: {}
    AssignCycleFacilityRequest:
      type: object
      required:
        - facility_id
      properties:
        facility_id:
          type: integer
          minimum: 1
          example: 2
      additionalProperties: false
    AssignCycleThematicAreaRequest:
      type: object
      required:
        - thematic_area_id
      properties:
        thematic_area_id:
          type: integer
          minimum: 1
          example: 1
      additionalProperties: false
    CycleFacilityAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            facility_id:
              type: integer
              example: 2
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CycleThematicAreaAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            thematic_area_id:
              type: integer
              example: 1
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CreateConversationRequest:
      type: object
      required:
        - participantIds
      properties:
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Other participants' IDs; the authenticated user is added automatically.
        type:
          type: string
          enum:
            - direct
            - group
          default: direct
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Optional array containing zero or one uploaded-file ID owned by the sender.
    EditMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
    Participant:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    MessageRead:
      type: object
      properties:
        userId:
          type: integer
        readAt:
          type: string
          format: date-time
    Attachment:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        storageKey:
          type: string
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
    UploadedFile:
      type: object
      properties:
        id:
          type: integer
          example: 12
        ownerId:
          type: integer
          example: 7
        context:
          type: string
          example: resource
        mimeType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          example: 20480
        createdAt:
          type: string
          format: date-time
          nullable: true
    Resource:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Clinical Guidelines for Malaria
        type:
          type: string
          enum: [pdf, audio, video]
          example: pdf
        thematicAreaId:
          type: integer
          nullable: true
        thematic_area_id:
          type: integer
          nullable: true
        moduleId:
          type: integer
          nullable: true
        module_id:
          type: integer
          nullable: true
        fileId:
          type: integer
          nullable: true
        file_id:
          type: integer
          nullable: true
        url:
          type: string
          nullable: true
        createdBy:
          type: integer
          nullable: true
        created_by:
          type: integer
          nullable: true
        updatedBy:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        module:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            title:
              type: string
            thematicAreaId:
              type: integer
            status:
              type: string
            isPublished:
              type: boolean
            isAuthorized:
              type: boolean
        thematicArea:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            code:
              type: string
            name:
              type: string
        file:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            mimeType:
              type: string
            sizeBytes:
              type: integer
            createdAt:
              type: string
              format: date-time
    CreateResourceRequest:
      type: object
      required: [title, type, thematic_area_id, module_id, file_id]
      properties:
        title:
          type: string
          example: Malaria Case Management Manual
        type:
          type: string
          enum: [pdf, audio, video]
          example: pdf
        thematic_area_id:
          type: integer
          example: 2
        module_id:
          type: integer
          example: 3
        file_id:
          type: integer
          example: 12
        url:
          type: string
          nullable: true
    UpdateResourceRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [pdf, audio, video]
        thematic_area_id:
          type: integer
        module_id:
          type: integer
        file_id:
          type: integer
        url:
          type: string
          nullable: true
    ResourceListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        sender:
          allOf:
            - $ref: '#/components/schemas/Participant'
          nullable: true
        attachment:
          $ref: '#/components/schemas/Attachment'
        reads:
          type: array
          items:
            $ref: '#/components/schemas/MessageRead'
    Conversation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - direct
            - group
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
    MessagingContact:
      type: object
      required:
        - id
        - full_name
        - role
        - avatar_url
      properties:
        id:
          type: integer
          example: 42
        full_name:
          type: string
          example: Alex Mentor
        role:
          type: string
          enum:
            - mentor
            - mentee
        avatar_url:
          type: string
          nullable: true
          example: https://example.org/avatar.png
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - isRead
        - createdAt
      properties:
        id:
          type: integer
          example: 12
        type:
          type: string
          description: Current event types include message_received, learning_module_published, learning_module_assigned, and quiz_result_finalized.
          example: message_received
        title:
          type: string
          example: New message
        body:
          type: string
          nullable: true
          example: You received a new message.
        isRead:
          type: boolean
          example: false
        referenceType:
          type: string
          nullable: true
          description: Type of related record, when applicable.
          example: conversation
        referenceId:
          type: integer
          nullable: true
          description: ID of the related record, when applicable.
          example: 23
