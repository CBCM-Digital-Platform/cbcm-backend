    get:
      summary: Get uploaded file metadata
      description: Retrieves file metadata for an uploaded file by ID.
      tags:
        - Uploads
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
