  /messages/conversations:
    get:
      tags:
        - Messaging
      summary: List the authenticated user's conversations
      responses:
        '200':
          description: Conversations returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
    post:
      tags:
        - Messaging
      summary: Create or retrieve a conversation
      description: The authenticated user is added as a participant automatically. Direct conversations must have exactly two participants, including the current user, and are limited to active mentor–mentee assignment pairs. An existing direct conversation between the same participants is returned rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
            examples:
              direct:
                value:
                  participantIds:
                    - 42
                  type: direct
              group:
                value:
                  participantIds:
                    - 42
                    - 43
                  type: group
      responses:
        '201':
          description: Conversation created or existing direct conversation returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
  /api/v1/messages/contacts:
    get:
      tags: [Messaging]
      summary: List messaging contacts
      description: Returns mentors or mentees connected to the authenticated user through active assignments. Email addresses are not included. Only mentors and mentees can use this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Optional case-insensitive name or email search. Matching email addresses are not returned.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Contacts returned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessagingContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only mentors and mentees can access messaging contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
