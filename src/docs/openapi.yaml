openapi: 3.0.0
info:
  title: CBCM Backend API
  version: 1.0.0
  description: CBCM authentication, user management, facilities, mentorship cycles, and cycle configuration APIs.
servers:
  - url: http://localhost:5000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@cbcm.org
        password:
          type: string
          format: password
          example: Admin@123
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - accessToken
            - refreshToken
            - user
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiJ9...
            accessTokenExpiresIn:
              type: string
              example: 15m
            refreshToken:
              type: string
              pattern: ^[a-f0-9]{64}$
              example: 64-character opaque refresh token
            refreshTokenExpiresAt:
              type: string
              format: date-time
              example: '2026-11-04T12:00:00.000Z'
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: If that email exists, a reset link will be sent.
        meta:
          type: object
          example: {}
    BooleanActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            reset:
              type: boolean
              example: true
            changed:
              type: boolean
              example: true
            revoked:
              type: boolean
              example: true
        meta:
          type: object
          example: {}
    RefreshTokenResponse:
      $ref: '#/components/schemas/LoginResponse'
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character one-time token delivered by email
        password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    UserProfile:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        role:
          type: string
          example: mentee
        status:
          type: string
          example: active
        facility_id:
          type: integer
          nullable: true
        highest_qualification:
          type: string
          nullable: true
        training_status:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        must_change_password:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    SessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          example: Jane Doe
        phone:
          type: string
          minLength: 7
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        avatar_url:
          type: string
          format: uri
          example: https://example.com/avatar.jpg
      additionalProperties: false
    UserPreferences:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 10
        language:
          type: string
          maxLength: 20
          nullable: true
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
          nullable: true
          example: system
        notifications_enabled:
          type: boolean
          nullable: true
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateUserPreferencesRequest:
      type: object
      minProperties: 1
      properties:
        language:
          type: string
          maxLength: 20
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        notifications_enabled:
          type: boolean
          example: true
      additionalProperties: false
    PreferencesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/UserPreferences'
          nullable: true
        meta:
          type: object
          example: {}
    CreateUserRequest:
      type: object
      required:
        - full_name
        - email
        - password
        - role
      properties:
        full_name:
          type: string
          minLength: 1
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: TemporaryPass1!
        role:
          type: string
          enum:
            - admin
            - facility_admin
            - mentor
            - mentee
          example: mentee
        facility_id:
          type: integer
          minimum: 1
          nullable: true
          example: 2
        phone:
          type: string
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        must_change_password:
          type: boolean
          default: true
          example: true
      additionalProperties: false
    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
          example: inactive
    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 3
    Facility:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Central Health Center
        type:
          type: string
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FacilityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    FacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 12
            totalPages:
              type: integer
              example: 1
    CreateFacilityRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          example: Central Health Center
        type:
          type: string
          minLength: 1
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    UpdateFacilityRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        level:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        woreda:
          type: string
          nullable: true
        kebele:
          type: string
          nullable: true
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    MentorshipCycle:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 2026 Mentorship Cycle 1
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          example: draft
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CycleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          example: {}
    CycleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 8
            totalPages:
              type: integer
              example: 1
    CreateCycleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: 2026 Mentorship Cycle 1
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
      additionalProperties: false
    UpdateCycleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
      additionalProperties: false
    UpdateCycleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          description: 'Transitions: draft to planned/cancelled; planned to active/cancelled; active to completed/cancelled. Completed and cancelled are terminal.'
      additionalProperties: false
    CycleFacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    CycleThematicAreaListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required:
              - id
              - code
              - name
            properties:
              id:
                type: integer
                example: 1
              code:
                type: string
                example: ANC
              name:
                type: string
                example: Antenatal care
        meta:
          type: object
          example: {}
    AssignCycleFacilityRequest:
      type: object
      required:
        - facility_id
      properties:
        facility_id:
          type: integer
          minimum: 1
          example: 2
      additionalProperties: false
    AssignCycleThematicAreaRequest:
      type: object
      required:
        - thematic_area_id
      properties:
        thematic_area_id:
          type: integer
          minimum: 1
          example: 1
      additionalProperties: false
    CycleFacilityAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            facility_id:
              type: integer
              example: 2
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CycleThematicAreaAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            thematic_area_id:
              type: integer
              example: 1
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CreateConversationRequest:
      type: object
      required:
        - participantIds
      properties:
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Other participants' IDs; the authenticated user is added automatically.
        type:
          type: string
          enum:
            - direct
            - group
          default: direct
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Optional array containing zero or one uploaded-file ID owned by the sender.
    EditMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
    Participant:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    MessageRead:
      type: object
      properties:
        userId:
          type: integer
        readAt:
          type: string
          format: date-time
    Attachment:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        storageKey:
          type: string
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        sender:
          allOf:
            - $ref: '#/components/schemas/Participant'
          nullable: true
        attachment:
          $ref: '#/components/schemas/Attachment'
        reads:
          type: array
          items:
            $ref: '#/components/schemas/MessageRead'
    Conversation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - direct
            - group
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
    MessagingContact:
      type: object
      required:
        - id
        - full_name
        - role
        - avatar_url
      properties:
        id:
          type: integer
          example: 42
        full_name:
          type: string
          example: Alex Mentor
        role:
          type: string
          enum:
            - mentor
            - mentee
        avatar_url:
          type: string
          nullable: true
          example: https://example.org/avatar.png
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - isRead
        - createdAt
      properties:
        id:
          type: integer
          example: 12
        type:
          type: string
          description: Current event types include message_received, learning_module_published, learning_module_assigned, and quiz_result_finalized.
          example: message_received
        title:
          type: string
          example: New message
        body:
          type: string
          nullable: true
          example: You received a new message.
        isRead:
          type: boolean
          example: false
        referenceType:
          type: string
          nullable: true
          description: Type of related record, when applicable.
          example: conversation
        referenceId:
          type: integer
          nullable: true
          description: ID of the related record, when applicable.
          example: 23
        createdAt:
          type: string
          format: date-time
          example: '2026-10-16T18:30:00.000Z'
    NotificationListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    LearningModule:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Infection Prevention in ANC
        description:
          type: string
          nullable: true
          example: Core learning for antenatal infection prevention.
        thematicAreaId:
          type: integer
          nullable: true
          example: 3
        protocolSummary:
          type: string
          nullable: true
          example: Follow clinical protocol before sign-off.
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          example: published
        orderNumber:
          type: integer
          example: 1
        isPublished:
          type: boolean
          example: true
        isAuthorized:
          type: boolean
          description: Administrator approval, independent of publication.
          example: true
        estimatedDurationMinutes:
          type: integer
          example: 45
        createdBy:
          type: integer
          nullable: true
          example: 12
        updatedBy:
          type: integer
          nullable: true
          example: 12
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        contents:
          type: array
          items:
            $ref: '#/components/schemas/LearningContentSummary'
      example:
        id: 1
        title: Infection Prevention in ANC
        description: Core learning for antenatal infection prevention.
        thematicAreaId: 3
        protocolSummary: Follow clinical protocol before sign-off.
        status: published
        orderNumber: 1
        isPublished: true
        isAuthorized: true
        estimatedDurationMinutes: 45
        createdBy: 12
        updatedBy: 12
        createdAt: '2026-09-04T09:00:00.000Z'
        updatedAt: '2026-10-02T15:40:00.000Z'
        contents:
          - id: 7
            title: Hand hygiene checklist
            type: article
            orderNumber: 1
            isRequired: true
    LearningContentSummary:
      type: object
      required:
        - id
        - title
        - type
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Hand hygiene checklist
        type:
          type: string
          example: article
        orderNumber:
          type: integer
          example: 1
        isRequired:
          type: boolean
          example: true
        isPublished:
          type: boolean
          example: true
        isAuthorized:
          type: boolean
          example: true
    LearningContent:
      type: object
      required:
        - id
        - moduleId
        - title
        - type
      properties:
        id:
          type: integer
          example: 7
        moduleId:
          type: integer
          example: 1
        title:
          type: string
          example: Hand hygiene checklist
        type:
          type: string
          enum:
            - article
            - video
            - pdf
            - quiz
          example: article
        contentText:
          type: string
          nullable: true
          example: Clean hands before and after patient contact.
        contentUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/hand-hygiene.mp4
        orderNumber:
          type: integer
          example: 1
        isRequired:
          type: boolean
          example: true
        isPublished:
          type: boolean
          example: true
        isAuthorized:
          type: boolean
          example: true
        durationMinutes:
          type: integer
          example: 10
        createdBy:
          type: integer
          nullable: true
        updatedBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    LearningModuleAccess:
      type: object
      required:
        - moduleId
        - menteeId
      properties:
        id:
          type: integer
          example: 18
        moduleId:
          type: integer
          example: 1
        menteeId:
          type: integer
          example: 42
        assignedBy:
          type: integer
          nullable: true
          example: 12
        assignedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
          example: not_started
    LearningModuleMentorAccess:
      type: object
      required:
        - moduleId
        - mentorId
        - grantedBy
        - grantedAt
      properties:
        id:
          type: integer
          example: 24
        moduleId:
          type: integer
          example: 1
        mentorId:
          type: integer
          example: 12
        grantedBy:
          type: integer
          example: 2
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        mentor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            fullName:
              type: string
            email:
              type: string
    LearningContentProgress:
      type: object
      properties:
        moduleId:
          type: integer
          example: 1
        contentId:
          type: integer
          example: 7
        status:
          type: string
          enum:
            - pending
            - completed
          example: completed
        completedAt:
          type: string
          format: date-time
          nullable: true
      example:
        moduleId: 1
        contentId: 7
        status: completed
        completedAt: '2026-10-10T14:20:00.000Z'
    LearningModuleProgress:
      type: object
      properties:
        id:
          type: integer
          example: 5
        moduleId:
          type: integer
          example: 1
        menteeId:
          type: integer
          example: 42
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
          example: in_progress
        completionPercentage:
          type: number
          format: float
          example: 75
        assignedBy:
          type: integer
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        module:
          allOf:
            - $ref: '#/components/schemas/LearningModule'
          nullable: true
      example:
        id: 5
        moduleId: 1
        menteeId: 42
        status: in_progress
        completionPercentage: 75
        assignedBy: 12
        assignedAt: '2026-10-08T10:00:00.000Z'
        startedAt: '2026-10-08T10:00:00.000Z'
        lastAccessedAt: '2026-10-11T08:30:00.000Z'
        completedAt: null
    QuizOption:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: integer
          example: 11
        text:
          type: string
          example: Wash hands before touching the patient.
        isCorrect:
          type: boolean
          example: true
        orderNumber:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    QuizQuestion:
      type: object
      required:
        - id
        - prompt
      properties:
        id:
          type: integer
          example: 9
        prompt:
          type: string
          example: Which step is most important before examining a patient?
        questionType:
          type: string
          example: single_choice
        clinicalContext:
          type: string
          nullable: true
          example: ANC consultation room
        points:
          type: number
          example: 2
        explanation:
          type: string
          nullable: true
          example: Hand hygiene reduces transmission risk.
        orderNumber:
          type: integer
          example: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuizOption'
    Quiz:
      type: object
      required:
        - id
        - moduleId
        - title
      properties:
        id:
          type: integer
          example: 4
        moduleId:
          type: integer
          example: 1
        title:
          type: string
          example: Infection prevention knowledge check
        description:
          type: string
          nullable: true
          example: Short assessment for the infection prevention module.
        passScore:
          type: number
          example: 70
        timeLimitMinutes:
          type: integer
          example: 15
        attemptLimit:
          type: integer
          example: 1
        isPublished:
          type: boolean
          example: true
        isAuthorized:
          type: boolean
          description: Administrator approval, independent of publication.
          example: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    QuizAttempt:
      type: object
      properties:
        id:
          type: integer
          example: 20
        quizId:
          type: integer
          example: 4
        menteeId:
          type: integer
          example: 42
        attemptNumber:
          type: integer
          example: 1
        score:
          type: number
          example: 80
        passed:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - in_progress
            - submitted
            - completed
          example: completed
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    QuizAnswerSubmission:
      type: object
      required:
        - questionId
      properties:
        questionId:
          type: integer
          example: 9
        selectedOptionId:
          type: integer
          nullable: true
          example: 11
        selectedOptionIds:
          type: array
          nullable: true
          items:
            type: integer
          example:
            - 11
            - 12
    QuizSubmissionRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswerSubmission'
      example:
        answers:
          - questionId: 9
            selectedOptionId: 11
          - questionId: 10
            selectedOptionId: 15
    QuizResult:
      type: object
      properties:
        id:
          type: integer
          example: 20
        quizId:
          type: integer
          example: 4
        menteeId:
          type: integer
          example: 42
        score:
          type: number
          example: 80
        passed:
          type: boolean
          example: true
        status:
          type: string
          example: completed
        attemptNumber:
          type: integer
          example: 1
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 20
        quizId: 4
        menteeId: 42
        score: 80
        passed: true
        status: completed
        attemptNumber: 1
        startedAt: '2026-10-11T09:15:00.000Z'
        completedAt: '2026-10-11T09:17:30.000Z'
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      description: Positive integer conversation ID.
      schema:
        type: integer
        minimum: 1
    MessageId:
      name: messageId
      in: path
      required: true
      description: Positive integer message ID.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not a conversation participant or cannot use the attachment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/v1/users/me:
    get:
      summary: Get current user's profile
      description: Returns the authenticated user's safe profile fields only.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update current user's editable profile fields
      description: Only full_name, phone, highest_qualification, training_status, and avatar_url are editable. Role, status, facility, and credential fields cannot be changed here.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated safe profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Profile validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/me/preferences:
    get:
      summary: Get current user's preferences
      description: Reads preferences for the authenticated user only and returns null when none have been saved.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update current user's preferences
      description: Updates or creates preferences for the authenticated user only.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          description: Preference validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      summary: List users (administrator only)
      description: Returns safe profile fields with pagination. Only administrators may list users.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: role
          schema:
            type: string
            enum:
              - admin
              - facility_admin
              - mentor
              - mentee
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - suspended
      responses:
        '200':
          description: Paginated safe user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Invalid pagination or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Provision a user (administrator only)
      description: Public self-registration is not supported. An administrator provisions a user with an allowed role and temporary password; password change is required by default.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User provisioned; password hash is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Facility not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{id}:
    get:
      summary: Get a user by ID (administrator only)
      description: Returns a safe user profile; password and credential secrets are never included.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Safe user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{id}/status:
    patch:
      summary: Change a user's status (administrator only)
      description: Deactivating or suspending a user revokes their refresh tokens and invalidates existing access tokens.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid ID or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Administrator cannot disable their own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/facilities:
    get:
      summary: List facilities
      description: Lists facilities with optional geography/type filters and pagination. Any authenticated user may view facilities.
      tags:
        - Facilities
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: level
          schema:
            type: string
        - in: query
          name: region
          schema:
            type: string
        - in: query
          name: zone
          schema:
            type: string
        - in: query
          name: woreda
          schema:
            type: string
      responses:
        '200':
          description: Paginated facilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityListResponse'
        '400':
          description: Invalid pagination or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a facility
      description: Administrator only. Facility fields match the existing facilities table; name and type are required by the API.
      tags:
        - Facilities
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFacilityRequest'
      responses:
        '201':
          description: Facility created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityResponse'
        '400':
          description: Invalid facility fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/facilities/{id}:
    get:
      summary: Get a facility
      tags:
        - Facilities
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
