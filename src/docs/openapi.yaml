      description: Facility Admin only, limited to modules in the administrator's facility. Mentors cannot create quizzes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                passScore:
                  type: number
                  minimum: 0
                timeLimitMinutes:
                  type: integer
                  minimum: 0
                attemptLimit:
                  type: integer
                  minimum: 0
                isPublished:
                  type: boolean
                isAuthorized:
                  type: boolean
                questions:
                  type: array
                  description: Optional questions with A-D choices. Existing question and option endpoints remain available.
                  items:
                    type: object
                    required: [prompt]
                    properties:
                      prompt:
                        type: string
                      questionType:
                        type: string
                      clinicalContext:
                        type: string
                        nullable: true
                      points:
                        type: number
                      explanation:
                        type: string
                        nullable: true
                      orderNumber:
                        type: integer
                      correctAnswer:
                        type: string
                        enum: [A, B, C, D]
                      options:
                        type: array
                        items:
                          type: object
                          required: [text]
                          properties:
                            text:
                              type: string
                            isCorrect:
                              type: boolean
                            label:
                              type: string
                              enum: [A, B, C, D]
                            orderNumber:
                              type: integer
                      choices:
                        type: object
                        properties:
                          A:
                            type: string
                          B:
                            type: string
                          C:
                            type: string
                          D:
                            type: string
            example:
              title: Maternal health knowledge check
              description: Post-module quiz
              passScore: 70
              timeLimitMinutes: 20
              attemptLimit: 2
              isPublished: false
              isAuthorized: false
              questions:
                - prompt: Which action is the first priority?
                  choices:
                    A: Delay evaluation
                    B: Start emergency assessment
                    C: Discharge immediately
                    D: Wait for lab results
                  correctAnswer: B
