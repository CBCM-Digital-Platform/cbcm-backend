        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanActionResponse'
        '400':
          description: Validation error or unchanged password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing authentication or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/session:
    get:
      summary: Validate the current access-token session
      description: Verifies the bearer JWT and returns the current safe user profile when the account remains active.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Missing, invalid, expired, stale, or inactive session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/conversations:
    get:
      tags:
        - Messaging
      summary: List the authenticated user's conversations
      responses:
        '200':
          description: Conversations returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
    post:
      tags:
        - Messaging
      summary: Create or retrieve a conversation
      description: The authenticated user is added as a participant automatically. Direct conversations must have exactly two participants, including the current user, and are limited to active mentor–mentee assignment pairs. An existing direct conversation between the same participants is returned rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
            examples:
              direct:
                value:
                  participantIds:
                    - 42
                  type: direct
              group:
                value:
                  participantIds:
                    - 42
                    - 43
                  type: group
      responses:
        '201':
          description: Conversation created or existing direct conversation returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
  /api/v1/messages/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags:
        - Messaging
      summary: Load a conversation and its messages
      description: Returns all messages in ascending send-time order. Access is limited to conversation participants; direct conversations also require a current active mentor–mentee assignment.
      responses:
        '200':
          description: Conversation detail returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
  /api/v1/messages/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags:
        - Messaging
      summary: Send a message to a conversation
      description: An optional owned uploaded-file ID may be attached. At most one attachment is supported. Direct conversations require a current active mentor–mentee assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: Hello!
              attachmentFileIds:
                - 123
      responses:
        '201':
          description: Message sent.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
  /api/v1/messages/conversations/{id}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/MessageId'
    patch:
      tags:
        - Messaging
      summary: Edit a message sent by the authenticated user
      description: The sender must be a participant in the conversation; direct conversations also require a current active mentor–mentee assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
            example:
              content: Corrected message text
      responses:
        '200':
          description: Message updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
    delete:
      tags:
        - Messaging
      summary: Permanently delete a message sent by the authenticated user
      description: The sender must be a participant in the conversation; direct conversations also require a current active mentor–mentee assignment.
      responses:
        '200':
          description: Message deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - deleted
                    properties:
                      deleted:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
  /api/v1/messages/conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      tags:
        - Messaging
      summary: Mark messages in a conversation as read
      description: The authenticated user must be a participant; direct conversations also require a current active mentor–mentee assignment.
      responses:
        '200':
          description: Read status updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - markedRead
                    properties:
                      markedRead:
                        type: integer
                        description: Number of messages marked as read.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
    servers:
      - url: http://localhost:5000/api/v1
        description: Local development server
tags: []
