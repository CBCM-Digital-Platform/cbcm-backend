openapi: 3.0.0
info:
  title: CBCM Backend API
  version: 1.0.0
  description: CBCM authentication, user management, facilities, mentorship cycles, and cycle configuration APIs.
servers:
  - url: http://localhost:5000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
              example: []
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@cbcm.org
        password:
          type: string
          format: password
          example: Admin@123
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - accessToken
            - refreshToken
            - user
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiJ9...
            accessTokenExpiresIn:
              type: string
              example: 15m
            refreshToken:
              type: string
              pattern: ^[a-f0-9]{64}$
              example: 64-character opaque refresh token
            refreshTokenExpiresAt:
              type: string
              format: date-time
              example: '2026-11-04T12:00:00.000Z'
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: If that email exists, a reset link will be sent.
        meta:
          type: object
          example: {}
    BooleanActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            reset:
              type: boolean
              example: true
            changed:
              type: boolean
              example: true
            revoked:
              type: boolean
              example: true
        meta:
          type: object
          example: {}
    RefreshTokenResponse:
      $ref: '#/components/schemas/LoginResponse'
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character one-time token delivered by email
        password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass2!
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: 64-character opaque refresh token
    UserProfile:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        role:
          type: string
          example: mentee
        status:
          type: string
          example: active
        facility_id:
          type: integer
          nullable: true
        highest_qualification:
          type: string
          nullable: true
        training_status:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        must_change_password:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    SessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          example: {}
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          example: Jane Doe
        phone:
          type: string
          minLength: 7
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        avatar_url:
          type: string
          format: uri
          example: https://example.com/avatar.jpg
      additionalProperties: false
    UserPreferences:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 10
        language:
          type: string
          maxLength: 20
          nullable: true
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
          nullable: true
          example: system
        notifications_enabled:
          type: boolean
          nullable: true
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateUserPreferencesRequest:
      type: object
      minProperties: 1
      properties:
        language:
          type: string
          maxLength: 20
          example: en
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        notifications_enabled:
          type: boolean
          example: true
      additionalProperties: false
    PreferencesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/UserPreferences'
          nullable: true
        meta:
          type: object
          example: {}
    CreateUserRequest:
      type: object
      required:
        - full_name
        - email
        - password
        - role
      properties:
        full_name:
          type: string
          minLength: 1
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: TemporaryPass1!
        role:
          type: string
          enum:
            - admin
            - facility_admin
            - mentor
            - mentee
          example: mentee
        facility_id:
          type: integer
          minimum: 1
          nullable: true
          example: 2
        phone:
          type: string
          example: '+251911234567'
        highest_qualification:
          type: string
          example: BSc Midwifery
        training_status:
          type: string
          example: in_training
        must_change_password:
          type: boolean
          default: true
          example: true
      additionalProperties: false
    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
          example: inactive
    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 3
    Facility:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Central Health Center
        type:
          type: string
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FacilityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    FacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 12
            totalPages:
              type: integer
              example: 1
    CreateFacilityRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          example: Central Health Center
        type:
          type: string
          minLength: 1
          example: health_center
        level:
          type: string
          nullable: true
          example: primary
        region:
          type: string
          nullable: true
          example: Oromia
        zone:
          type: string
          nullable: true
          example: West Shewa
        woreda:
          type: string
          nullable: true
          example: Ambo
        kebele:
          type: string
          nullable: true
          example: '01'
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    UpdateFacilityRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        level:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        woreda:
          type: string
          nullable: true
        kebele:
          type: string
          nullable: true
        street_address:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
      additionalProperties: false
    MentorshipCycle:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 2026 Mentorship Cycle 1
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          example: draft
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CycleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          example: {}
    CycleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MentorshipCycle'
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 8
            totalPages:
              type: integer
              example: 1
    CreateCycleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: 2026 Mentorship Cycle 1
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2027-04-30'
      additionalProperties: false
    UpdateCycleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
      additionalProperties: false
    UpdateCycleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - planned
            - active
            - completed
            - cancelled
          description: 'Transitions: draft to planned/cancelled; planned to active/cancelled; active to completed/cancelled. Completed and cancelled are terminal.'
      additionalProperties: false
    CycleFacilityListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        meta:
          type: object
          example: {}
    CycleThematicAreaListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required:
              - id
              - code
              - name
            properties:
              id:
                type: integer
                example: 1
              code:
                type: string
                example: ANC
              name:
                type: string
                example: Antenatal care
        meta:
          type: object
          example: {}
    AssignCycleFacilityRequest:
      type: object
      required:
        - facility_id
      properties:
        facility_id:
          type: integer
          minimum: 1
          example: 2
      additionalProperties: false
    AssignCycleThematicAreaRequest:
      type: object
      required:
        - thematic_area_id
      properties:
        thematic_area_id:
          type: integer
          minimum: 1
          example: 1
      additionalProperties: false
    CycleFacilityAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            facility_id:
              type: integer
              example: 2
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CycleThematicAreaAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            cycle_id:
              type: integer
              example: 1
            thematic_area_id:
              type: integer
              example: 1
            assigned:
              type: boolean
              example: true
            removed:
              type: boolean
              example: false
        meta:
          type: object
          example: {}
    CreateConversationRequest:
      type: object
      required:
        - participantIds
      properties:
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Other participants' IDs; the authenticated user is added automatically.
        type:
          type: string
          enum:
            - direct
            - group
          default: direct
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Optional array containing zero or one uploaded-file ID owned by the sender.
    EditMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
    Participant:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    MessageRead:
      type: object
      properties:
        userId:
          type: integer
        readAt:
          type: string
          format: date-time
    Attachment:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        storageKey:
          type: string
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        sender:
          allOf:
            - $ref: '#/components/schemas/Participant'
          nullable: true
        attachment:
          $ref: '#/components/schemas/Attachment'
        reads:
          type: array
          items:
            $ref: '#/components/schemas/MessageRead'
    Conversation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - direct
            - group
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      description: Positive integer conversation ID.
      schema:
        type: integer
        minimum: 1
    MessageId:
      name: messageId
      in: path
      required: true
      description: Positive integer message ID.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not a conversation participant or cannot use the attachment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Conversation or attachment not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/v1/users/me:
    get:
      summary: Get current user's profile
      description: Returns the authenticated user's safe profile fields only.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update current user's editable profile fields
      description: Only full_name, phone, highest_qualification, training_status, and avatar_url are editable. Role, status, facility, and credential fields cannot be changed here.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated safe profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Profile validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/me/preferences:
    get:
      summary: Get current user's preferences
      description: Reads preferences for the authenticated user only and returns null when none have been saved.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update current user's preferences
      description: Updates or creates preferences for the authenticated user only.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          description: Preference validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      summary: List users (administrator only)
      description: Returns safe profile fields with pagination. Only administrators may list users.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: role
          schema:
            type: string
            enum:
              - admin
              - facility_admin
              - mentor
              - mentee
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - suspended
      responses:
        '200':
          description: Paginated safe user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Invalid pagination or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Provision a user (administrator only)
      description: Public self-registration is not supported. An administrator provisions a user with an allowed role and temporary password; password change is required by default.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User provisioned; password hash is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
