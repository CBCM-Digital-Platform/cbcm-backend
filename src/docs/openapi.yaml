            A:
              type: string
              example: Delay evaluation
            B:
              type: string
              example: Start emergency assessment
            C:
              type: string
              example: Discharge immediately
            D:
              type: string
              example: Wait for lab results
          example:
            A: Delay evaluation
            B: Start emergency assessment
            C: Discharge immediately
            D: Wait for lab results
        options:
          type: array
          description: Alternative to choices. Use label A-D or isCorrect on each option.
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                example: Start emergency assessment
              isCorrect:
                type: boolean
                example: true
              label:
                type: string
                enum: [A, B, C, D]
                example: B
              orderNumber:
                type: integer
                example: 1
