      responses:
        '200':
          description: Conversations returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
    post:
      tags:
        - Messaging
      summary: Create or retrieve a conversation
      description: The authenticated user is added as a participant automatically. Direct conversations must have exactly two participants, including the current user, and are limited to active mentor–mentee assignment pairs. An existing direct conversation between the same participants is returned rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
            examples:
              direct:
                value:
                  participantIds:
                    - 42
                  type: direct
              group:
                value:
                  participantIds:
                    - 42
                    - 43
                  type: group
      responses:
        '201':
          description: Conversation created or existing direct conversation returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
        - bearerAuth: []
