  /api/v1/uploads:
    post:
      summary: Upload a file
      description: Uploads a media file (PDF, MP3, WAV, MP4, MOV, or WebM) using multipart/form-data. The file is validated by magic bytes signature and size limit, then stored in the configured storage provider.
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary file to upload
                context:
                  type: string
                  default: resource
                  description: Context or category for the file upload (e.g. resource, avatar, guide)
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFileResponse'
        '400':
          description: File required, unsupported type, empty file, or size exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

