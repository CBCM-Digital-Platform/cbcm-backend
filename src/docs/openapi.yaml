          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: thematicAreaId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: publishedOnly
          in: query
          schema:
            type: boolean
        - name: authorizedOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/LearningList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Learning]
      summary: Create a learning module
      description: Available to system and facility administrators.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                thematicAreaId:
                  type: integer
                  nullable: true
                protocolSummary:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, published, archived]
